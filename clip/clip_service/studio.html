<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,">
<title>Clip Studio</title>
<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#e9edf1;background:#11161a;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #455057;background:#273239;color:#edf5f4;padding:9px 12px;border-radius:5px}button:hover{background:#36444b}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#b6e35a;color:#152012;border-color:#b6e35a;font-weight:700}.danger{color:#ffc0b5;border-color:#79544b}.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.rail{padding:24px 18px;border-right:1px solid #30393d;background:#192126}.brand{font-weight:800;font-size:20px}.brand span{color:#b6e35a}.label{color:#99a9af;font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:.08em;margin:30px 0 10px}.rail input,.form input{width:100%;background:#10171a;border:1px solid #465258;border-radius:4px;color:#fff;padding:10px}.rail button{width:100%;margin-top:8px}.small{color:#9aacb0;font-size:12px;line-height:1.5}.main{min-width:0}.top{padding:17px 26px;border-bottom:1px solid #30393d;display:flex;justify-content:space-between;gap:15px;align-items:center}.top h1{font-size:19px;margin:0}.status{color:#b6e35a}.content{padding:24px 26px;display:grid;grid-template-columns:minmax(320px,1.25fr) minmax(300px,.75fr);gap:24px;max-width:1600px}.video{width:100%;aspect-ratio:16/9;background:#050809;display:block}.panel{border:1px solid #3a4448;border-radius:6px;overflow:hidden;background:#1d272b}.panel h2{font-size:14px;margin:0;padding:14px 16px;border-bottom:1px solid #3a4448}.body{padding:16px}.muted{color:#9aacb0}.clip{width:100%;text-align:left;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}.clip.active{border-color:#b6e35a}.clip strong{display:block}.pill{font-size:11px;color:#b6e35a}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:block;color:#9aacb0;font-size:12px}.form input{margin-top:5px}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.reason{line-height:1.5;white-space:pre-wrap}.transcript{line-height:1.6;max-height:220px;overflow:auto}.history{font-size:12px;color:#b8c5c8}.warning{color:#ffd28a}.hide{display:none}.span{grid-column:1/-1}#notice{padding:10px 26px;color:#ffd28a}#notice:empty{display:none}@media(max-width:850px){.shell{display:block}.rail{border-right:0;border-bottom:1px solid #30393d;padding:16px}.content{grid-template-columns:1fr;padding:16px}.top{padding:15px 16px}.label{margin-top:15px}}
.history{white-space:pre-line}select,textarea{font:inherit;background:#10171a;border:1px solid #465258;border-radius:4px;color:#fff;padding:9px}textarea{width:100%;min-height:64px;resize:vertical}.voice-line{display:grid;grid-template-columns:90px 90px minmax(0,1fr) auto;gap:7px;margin-bottom:8px;align-items:start}.voice-line input{width:100%;background:#10171a;border:1px solid #465258;border-radius:4px;color:#fff;padding:9px}.voice-status{font-size:12px;color:#b6e35a;overflow-wrap:anywhere}#voice-preview{aspect-ratio:9/16;max-height:550px;object-fit:contain}audio{width:100%;margin-top:12px}@media(max-width:600px){.voice-line{grid-template-columns:1fr 1fr}.voice-line textarea{grid-column:1/-1}.voice-line button{grid-column:1/-1}}
</style>
</head>
<body><div class="shell"><aside class="rail"><div class="brand"><span>c/</span> Clip Studio</div><p class="small">Редакторский отбор</p><div class="label">Доступ</div><input id="key" type="password" placeholder="API key" aria-label="API key"><button id="connect">Подключиться</button><div class="label">Задача</div><input id="job" placeholder="Job ID" aria-label="Job ID"><button id="load" class="primary">Открыть</button><div class="label">Недавние задачи</div><nav id="recent" aria-label="Недавние задачи"></nav></aside><main class="main"><header class="top"><h1 id="title">Обзор клипов</h1><span id="status" class="status"></span></header><div id="notice" role="status"></div><div class="content"><section><div class="panel"><video id="video" class="video" controls preload="metadata"></video><div class="body"><div id="range" class="muted">Выберите кандидат</div><div class="row"><button id="context">Контекст ±15 с</button><button id="moment">Фрагмент</button></div></div></div><div class="panel" style="margin-top:16px"><h2>Транскрипт</h2><div id="transcript" class="body transcript muted"></div></div></section><section><div class="panel"><h2>Кандидаты</h2><div id="clips" class="body"></div></div><div class="panel" style="margin-top:16px"><h2>Решение редактора</h2><div class="body"><div id="reason" class="reason muted"></div><p id="quality" class="warning hide">Разрешение источника недостаточно для детального вертикального кадра.</p><div class="form"><label>Начало, с<input id="start" type="number" min="0" step="0.01"></label><label>Конец, с<input id="end" type="number" min="0" step="0.01"></label></div><div class="row"><button id="save">Сохранить границы</button><button id="approve" class="primary">Одобрить</button><button id="reject" class="danger">Отклонить</button></div><div class="row"><button id="work">Проект CutWright</button><button id="export">Экспорт из clip</button></div><p id="workpath" class="small"></p><div class="label">Финальный MP4 из CutWright</div><div class="form"><label class="span">Локальный путь<input id="final-path" type="text" placeholder="C:\Videos\edited.mp4"></label></div><div class="row"><button id="finalize" class="primary">Проверить и принять</button></div><div class="label">История решений</div><div id="history" class="history"></div></div></div><div class="panel" style="margin-top:16px"><h2>Добавить интервал</h2><div class="body"><div class="form"><label>Начало, с<input id="manual-start" type="number" min="0" step="0.01"></label><label>Конец, с<input id="manual-end" type="number" min="0" step="0.01"></label></div><div class="row"><button id="add">Добавить</button></div></div></div></section></div></main></div>
<script>
// Gaming layout controls are applied with the same review action as interval edits.
function ensureGamingControls(){if($('camera')||!job||job.template!=='gaming')return;let host=$('start').closest('.form');let label=document.createElement('label');label.textContent='Камера стримера';let select=document.createElement('select');select.id='camera';[['none','Не показывать'],['left','Слева'],['right','Справа']].forEach(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;select.append(o)});label.append(select);host.append(label)}
const $=id=>document.getElementById(id);let job=null,clip=null,stopAt=null;const key=()=> $('key').value||sessionStorage.getItem('clip-key')||'';
const titleLabel=document.createElement('label');titleLabel.className='span';titleLabel.textContent='Название клипа';const titleInput=document.createElement('input');titleInput.id='clip-title';titleInput.maxLength=200;titleLabel.append(titleInput);$('start').closest('.form').prepend(titleLabel);const titleSave=document.createElement('button');titleSave.textContent='Сохранить название';$('save').before(titleSave);titleSave.onclick=async()=>{if(!clip)return;try{let c=await api('/clips/'+clip.id+'/title','PATCH',{title:titleInput.value});job.clips=job.clips.map(x=>x.id===c.id?c:x);clip=c;render();notice('Название сохранено'+(c.artifacts?.mp4?' · '+c.artifacts.mp4:''))}catch(e){notice(e.message)}};
function notice(message){$('notice').textContent=message}
async function api(path,method='GET',body){let r=await fetch(path,{method,headers:{'X-API-Key':key(),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});let data=await r.json();if(!r.ok)throw Error(data.detail||r.statusText);return data}
async function recent(){let rows=await api('/jobs');let nav=$('recent');nav.replaceChildren();for(let row of rows){let b=document.createElement('button');b.textContent=row.id.slice(0,10)+' · '+row.status;b.onclick=()=>{$('job').value=row.id;load()};nav.append(b)}}
async function load(){try{job=await api('/jobs/'+encodeURIComponent($('job').value));$('title').textContent='Задача '+job.id.slice(0,10);$('status').textContent=job.status;let r=await fetch('/studio/session',{method:'POST',headers:{'X-API-Key':key()}});if(!r.ok)throw Error('Неверный API key');sessionStorage.setItem('clip-key',key());$('video').src='/jobs/'+encodeURIComponent(job.id)+'/media';render();recent();notice('')}catch(e){notice(e.message)}}
function render(){let list=$('clips');list.replaceChildren();titleInput.value=clip?.title||'';for(let c of job.clips){let b=document.createElement('button');b.className='clip'+(clip?.id===c.id?' active':'');let left=document.createElement('span');let strong=document.createElement('strong');strong.textContent=c.title||'Clip';left.append(strong);let time=document.createElement('small');time.textContent=c.start.toFixed(2)+'–'+c.end.toFixed(2)+' с';left.append(time);let tag=document.createElement('span');tag.className='pill';tag.textContent=c.status;b.append(left,tag);b.onclick=()=>select(c);list.append(b)}if(!job.clips.length)list.textContent='Рекомендаций нет. Можно добавить интервал вручную.'}
async function select(c){clip=c;$('start').value=c.start;$('end').value=c.end;$('range').textContent='Рекомендуемый интервал: '+c.start.toFixed(2)+'–'+c.end.toFixed(2)+' с';$('transcript').textContent=c.review?.text||'Транскрипт не сохранён для ручного интервала.';let v=c.review?.reasons||{};$('reason').textContent=[v.reason,v.hook&&'Хук: '+v.hook,v.completion&&'Завершение: '+v.completion,v.intrusions&&'Вставки: '+v.intrusions,v.boundaries&&'Границы: '+v.boundaries,c.review?.qc&&'QC: '+(c.review.qc.warnings?.join('; ')||'без предупреждений')].filter(Boolean).join('\n');$('quality').classList.toggle('hide',!c.review?.low_resolution);$('video').currentTime=c.start;render();$('history').textContent='';try{let rows=await api('/clips/'+c.id+'/decisions');$('history').textContent=rows.map(x=>x.action+' · '+x.start.toFixed(2)+'–'+x.end.toFixed(2)+' · '+x.reason).join('\n')||'Решений пока нет'}catch(e){notice(e.message)}}
async function action(name){if(!clip)return;try{let reason=name==='reject'?prompt('Причина отклонения:'):'';if(name==='reject'&&!reason)return;let updated=await api('/clips/'+clip.id+'/review','POST',{action:name,reason,start:Number($('start').value),end:Number($('end').value)});job.clips=job.clips.map(c=>c.id===updated.id?updated:c);await select(updated);notice('Решение сохранено')}catch(e){notice(e.message)}}
function play(context){if(!clip)return;let start=context?Math.max(0,clip.start-15):clip.start;stopAt=context?Math.min(clip.review.probe.duration,clip.end+15):clip.end;let v=$('video');v.currentTime=start;v.play()}
$('video').ontimeupdate=()=>{if(stopAt!==null&&$('video').currentTime>=stopAt){$('video').pause();stopAt=null}};
$('connect').onclick=async()=>{try{let r=await fetch('/studio/session',{method:'POST',headers:{'X-API-Key':key()}});if(!r.ok)throw Error('Неверный API key');sessionStorage.setItem('clip-key',key());await recent();notice('Подключено')}catch(e){notice(e.message)}};
$('load').onclick=load;$('context').onclick=()=>play(true);$('moment').onclick=()=>play(false);$('save').onclick=()=>action('edit');$('approve').onclick=()=>action('approve');$('reject').onclick=()=>action('reject');
$('add').onclick=async()=>{if(!job)return;try{let c=await api('/jobs/'+job.id+'/intervals','POST',{start:Number($('manual-start').value),end:Number($('manual-end').value)});job.clips.push(c);await select(c);notice('Интервал добавлен')}catch(e){notice(e.message)}};
$('work').onclick=async()=>{if(!clip)return;try{let r=await api('/clips/'+clip.id+'/working-copy','POST');$('workpath').textContent=r.project_path+' · монтаж '+r.timeline_start.toFixed(2)+'–'+r.timeline_end.toFixed(2)+' с';notice('Проект CutWright и рабочие копии готовы')}catch(e){notice(e.message)}};
$('export').onclick=async()=>{if(!clip)return;try{let c=await api('/clips/'+clip.id+'/export','POST');job.clips=job.clips.map(x=>x.id===c.id?c:x);await select(c);notice('Экспорт готов: '+c.artifacts.mp4)}catch(e){notice(e.message)}};
$('finalize').onclick=async()=>{if(!clip)return;try{let c=await api('/clips/'+clip.id+'/finalize','POST',{path:$('final-path').value});job.clips=job.clips.map(x=>x.id===c.id?c:x);await select(c);notice('Финальный MP4 принят: '+c.artifacts.mp4)}catch(e){notice(e.message)}};
let saved=sessionStorage.getItem('clip-key');if(saved){$('key').value=saved;recent().catch(()=>{})}setInterval(ensureGamingControls,500);$('save').addEventListener('click',()=>{if(job?.template==='gaming'&&clip&&$('camera'))setTimeout(()=>api('/clips/'+clip.id+'/review','POST',{action:'edit',reason:'',start:Number($('start').value),end:Number($('end').value),camera_side:$('camera').value}).catch(e=>notice(e.message)),150)})
const voicePanel=document.createElement('div');voicePanel.className='panel';voicePanel.style.marginTop='16px';voicePanel.innerHTML='<h2>Озвучивание финального MP4</h2><div class="body"><div class="form"><label>Режим<select id="voice-mode"><option value="description">Аудиодескрипция</option><option value="commentary">Эмоциональный комментарий</option><option value="intro">Вступление</option></select></label></div><div class="row"><button id="voice-create" class="primary">Создать черновик</button><button id="voice-refresh">Обновить</button></div><p id="voice-state" class="voice-status"></p><div id="voice-lines"></div><div class="row"><button id="voice-add">Добавить реплику</button><button id="voice-save">Сохранить текст</button><button id="voice-approve" class="primary">Утвердить и озвучить</button><button id="voice-retry">Повторить</button></div><audio id="voice-audio" controls class="hide"></audio><video id="voice-preview" class="video hide" controls preload="metadata"></video><div id="voice-links" class="row"></div></div>';
document.querySelector('.content > section:last-child').append(voicePanel);let voice=null;
function addVoiceLine(line={start:0,end:2,text:''}){let row=document.createElement('div');row.className='voice-line';for(let [field,label] of [['start','Начало'],['end','Конец']]){let input=document.createElement('input');input.type='number';input.min='0';input.step='0.01';input.value=line[field];input.setAttribute('aria-label',label+' реплики');row.append(input)}let area=document.createElement('textarea');area.value=line.text;area.setAttribute('aria-label','Текст реплики');row.append(area);let remove=document.createElement('button');remove.textContent='Удалить';remove.onclick=()=>row.remove();row.append(remove);$('voice-lines').append(row)}
function renderVoice(){if(!voice){$('voice-state').textContent=clip?.artifacts?.mp4?'Выберите режим и создайте черновик':'Сначала экспортируйте клип';$('voice-lines').replaceChildren();$('voice-links').replaceChildren();$('voice-audio').classList.add('hide');$('voice-preview').classList.add('hide');return}$('voice-state').textContent=voice.status+(voice.error?' · '+voice.error:'');$('voice-lines').replaceChildren();for(let line of voice.lines)addVoiceLine(line);$('voice-links').replaceChildren();if(voice.artifacts.wav){for(let [kind,label] of [['wav','Дорожка WAV'],['mp4','Видео MP4']]){let a=document.createElement('a');a.href=voice.artifacts[kind];a.textContent=label;a.download='';a.style.color='#b6e35a';$('voice-links').append(a)}$('voice-audio').src=voice.artifacts.wav;$('voice-audio').classList.remove('hide');$('voice-preview').src=voice.artifacts.mp4;$('voice-preview').classList.remove('hide')}else{$('voice-audio').classList.add('hide');$('voice-audio').removeAttribute('src');$('voice-preview').classList.add('hide');$('voice-preview').removeAttribute('src')}}
async function refreshVoice(){if(!clip)return;let list=await api('/clips/'+clip.id+'/voiceovers');voice=list[0]||null;renderVoice()}
const oldSelect=select;select=async function(c){await oldSelect(c);voice=null;await refreshVoice().catch(e=>notice(e.message))};
$('voice-create').onclick=async()=>{if(!clip?.artifacts?.mp4)return notice('Сначала экспортируйте клип');try{voice=await api('/voiceovers','POST',{clip_id:clip.id,mode:$('voice-mode').value});renderVoice()}catch(e){notice(e.message)}};
$('voice-refresh').onclick=()=>refreshVoice().catch(e=>notice(e.message));$('voice-add').onclick=()=>addVoiceLine();
$('voice-save').onclick=async()=>{if(!voice)return;try{let lines=[...document.querySelectorAll('.voice-line')].map(row=>({start:Number(row.children[0].value),end:Number(row.children[1].value),text:row.children[2].value}));voice=await api('/voiceovers/'+voice.id+'/lines','PUT',{lines});renderVoice();notice('Черновик сохранён')}catch(e){notice(e.message)}};
$('voice-approve').onclick=async()=>{if(!voice)return;try{voice=await api('/voiceovers/'+voice.id+'/approve','POST');renderVoice();notice('Озвучивание запущено')}catch(e){notice(e.message)}};
$('voice-retry').onclick=async()=>{if(!voice)return;try{voice=await api('/voiceovers/'+voice.id+'/retry','POST');renderVoice()}catch(e){notice(e.message)}};
setInterval(()=>{if(voice&&['queued','analyzing','approved','rendering'].includes(voice.status))refreshVoice().catch(e=>notice(e.message))},4000);
</script>
<style>
.episode-filter{width:100%;margin-bottom:10px}.clip{align-items:center;min-height:66px}.clip[hidden]{display:none}.clip img{width:72px;height:48px;object-fit:cover;background:#10171a;flex:none}.clip small{display:block;font-variant-numeric:tabular-nums;color:#9aacb0}.clip[data-selection="keep"]{border-left:3px solid #b6e35a}.clip[data-selection="skip"]{opacity:.65}.storyboard{display:grid;gap:6px;max-height:220px;overflow:auto}.storyboard button{text-align:left}.choice-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.choice-row button{flex:1;min-width:90px}
</style>
<script>
const episodeFilter=document.createElement('select');episodeFilter.id='episode-filter';episodeFilter.className='episode-filter';episodeFilter.setAttribute('aria-label','Фильтр решений');for(const [value,label] of [['all','Все эпизоды'],['unselected','Не выбраны'],['keep','Оставить'],['skip','Пропустить'],['needs_fix','Требуют исправления']]){let option=document.createElement('option');option.value=value;option.textContent=label;episodeFilter.append(option)}$('clips').before(episodeFilter);
const storyboard=document.createElement('div');storyboard.className='panel';storyboard.style.marginTop='16px';storyboard.innerHTML='<h2>Раскадровка</h2><div id="storyboard" class="body storyboard"></div>';document.querySelector('.content > section:first-child').append(storyboard);
const previewButton=document.createElement('button');previewButton.textContent='Готовый клип';$('moment').after(previewButton);previewButton.onclick=()=>{if(!clip?.artifacts?.mp4)return;stopAt=null;$('video').src='/clips/'+clip.id+'/artifacts/mp4';$('video').play()};
const choices=document.createElement('div');choices.className='choice-row';for(const [value,label] of [['keep','Оставить'],['skip','Пропустить'],['unselected','Сбросить выбор']]){let button=document.createElement('button');button.textContent=label;button.onclick=async()=>{if(!clip)return;try{let updated=await api('/clips/'+clip.id+'/selection','PUT',{selection:value});job.clips=job.clips.map(c=>c.id===updated.id?updated:c);await select(updated);notice('Выбор сохранён')}catch(e){notice(e.message)}};choices.append(button)}$('export').closest('.row').before(choices);
const editForm=$('start').closest('.form');const focusLabel=document.createElement('label');focusLabel.textContent='Фокус X (0–1)';focusLabel.innerHTML+='<input id="focus" type="number" min="0" max="1" step="0.01">';editForm.append(focusLabel);const methodLabel=document.createElement('label');methodLabel.textContent='Удаление текста';methodLabel.innerHTML+='<select id="text-method"><option value="auto">Авто</option><option value="crop">Обрезать</option><option value="mask">Маска</option><option value="delogo">Восстановить</option><option value="none">Не удалять</option></select>';editForm.append(methodLabel);
const baseRender=render;render=function(){baseRender();for(const button of $('clips').querySelectorAll('.clip')){const c=job.clips.find(item=>button.textContent.includes(item.title));if(!c)continue;button.dataset.selection=c.selection||'unselected';if(c.artifacts?.thumbnail){let img=document.createElement('img');img.src='/clips/'+c.id+'/artifacts/thumbnail';img.alt='';button.prepend(img)}const label=button.querySelector('.pill');label.textContent=(c.status==='exported'?'Готов':c.status==='needs_fix'?'Исправить':c.status)+' · '+({keep:'Оставить',skip:'Пропустить',unselected:'Не выбран'}[c.selection||'unselected']);const seconds=document.createElement('small');seconds.textContent=' · '+(c.end-c.start).toFixed(1)+' с';button.querySelector('small')?.append(seconds);let filter=episodeFilter.value;button.hidden=filter!=='all'&&filter!==(c.status==='needs_fix'?'needs_fix':c.selection||'unselected')}};
episodeFilter.onchange=render;
const baseSelect=select;select=async function(c){await baseSelect(c);$('video').src='/jobs/'+job.id+'/media';$('video').currentTime=c.start;$('focus').value=c.review?.crop_points?.[0]?.x??'';$('text-method').value=c.review?.layout?.text_method||'auto';ensureGamingControls();const face=c.review?.plans?.find(p=>p.facecam)?.facecam;const side=c.review?.layout?.side||(face?(face.x+face.w/2<.5?'left':'right'):'none');if($('camera'))$('camera').value=c.review?.layout?.present?side:'none';const list=$('storyboard');list.replaceChildren();for(const p of c.review?.plans||[]){let button=document.createElement('button');button.textContent=p.at.toFixed(1)+' с · '+(p.reason||'План');button.onclick=()=>{$('video').currentTime=p.at};list.append(button)}$('approve').hidden=c.review?.algorithm!=='manual-v1';$('reject').hidden=$('approve').hidden;choices.children[0].disabled=c.status!=='exported';render()};
const baseAction=action;action=async function(name){if(!clip||clip.review?.algorithm==='manual-v1')return baseAction(name);try{const focus=$('focus').value;let updated=await api('/clips/'+clip.id+'/review','POST',{action:'edit',start:Number($('start').value),end:Number($('end').value),camera_side:$('camera')?.value||'none',text_method:$('text-method').value,crop_points:focus?[{x:Number(focus),y:.5}]:[]});job.clips=job.clips.map(c=>c.id===updated.id?updated:c);await select(updated);notice('Правки сохранены. Экспортируйте клип повторно.')}catch(e){notice(e.message)}};
const basePlay=play;play=function(context){if(clip)$('video').src='/jobs/'+job.id+'/media';basePlay(context)};
const saveClean=$('save').cloneNode(true);$('save').replaceWith(saveClean);saveClean.onclick=()=>action('edit');
</script></body></html>
